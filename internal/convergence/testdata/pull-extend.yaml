# pull.yaml with the article m_t2 added.
# The snapshot agent's schedule never fires: the tests start it. The
# distributor is the lab's, not compared (R4).
version: 2
publisher:
  server: {server}
  database: {db}
publications:
  - name: m_pp
    type: transactional
    status: active
    sync_method: native
    independent_agent: true
    immediate_sync: false
    allow_pull: true
    snapshot_agent:
      schedules:
        - frequency: once
          start_date: 99991231
    articles:
      - name: m_t1
        source:
          schema: dbo
          name: m_t1
      - name: m_t2
        source:
          schema: dbo
          name: m_t2
    subscriptions:
      - subscriber: {server}
        database: {sub}
        type: pull
        subscriber_type: sql_server
        initialization: snapshot
