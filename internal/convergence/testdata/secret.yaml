# The publication m_p of {db}: m_t1, pushed to {sub} by a distribution
# agent that connects to the subscriber as the SQL login {login}, whose
# password the test sets in SQLREPL_SQL_M_LOGIN (R54).
# The snapshot agent's schedule never fires: apply starts it. The
# distributor is the lab's, not compared (R4).
version: 2
publisher:
  server: {server}
  database: {db}
publications:
  - name: m_p
    type: transactional
    status: active
    sync_method: native
    independent_agent: true
    immediate_sync: false
    snapshot_agent:
      schedules:
        - frequency: once
          start_date: 99991231
    articles:
      - name: m_t1
        source:
          schema: dbo
          name: m_t1
    subscriptions:
      - subscriber: {server}
        database: {sub}
        type: push
        initialization: snapshot
        distribution_agent:
          connection:
            security: sql
            login: {login}
            password_secret: SQLREPL_SQL_M_LOGIN
