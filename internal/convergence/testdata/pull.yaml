# The publication m_pp of {db}: m_t1, pulled by {sub}. The pull agent
# job has no schedule: the tests start it.
# The snapshot agent's schedule never fires: the tests start it. The
# distributor is the lab's, not compared (R4).
version: 2
publisher:
  server: {server}
  database: {db}
publications:
  - name: m_pp
    type: transactional
    status: active
    sync_method: native
    independent_agent: true
    immediate_sync: false
    allow_pull: true
    snapshot_agent:
      schedules:
        - frequency: once
          start_date: 99991231
    articles:
      - name: m_t1
        source:
          schema: dbo
          name: m_t1
    subscriptions:
      - subscriber: {server}
        database: {sub}
        type: pull
        initialization: snapshot
